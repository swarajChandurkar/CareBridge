<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — CareBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #12AEC4;
            --color-primary-dark: #0C93A6;
            --color-primary-light: #E7F7F9;
            --color-bg: #F7FAFB;
            --color-text: #263238;
            --color-muted: #7C8D96;
            --color-border: #E3EBEE;
        }
        body { font-family: 'Inter', sans-serif; background: var(--color-bg); margin: 0; min-height: 100vh; }
        .cb-navbar { background: #fff; border-bottom: 1px solid var(--color-border); padding: 16px 0; }
        .cb-navbar .navbar-brand { font-size: 1.5rem; font-weight: 700; color: #263238; text-decoration: none; }
        .cb-navbar .navbar-brand span { color: var(--color-primary); }
        .btn-cb-primary { background: var(--color-primary); color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; transition: 0.2s; }
        .btn-cb-primary:hover { background: var(--color-primary-dark); }
        .cb-reg-card { background: #fff; border-radius: 14px; border: 1px solid var(--color-border); padding: 36px; max-width: 540px; margin: 40px auto; box-shadow: var(--shadow-sm); }
    </style>
</head>
<body>
    <nav class="cb-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">Care<span>Bridge</span></a>
            <a href="login.html" class="btn-cb-outline" style="border:1.5px solid var(--color-primary); color:var(--color-primary); padding:6px 14px; border-radius:8px; text-decoration:none; font-weight:600;">Back to Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="cb-reg-card">
            <h3 style="font-weight: 700; margin-bottom: 6px;">Create your Patient Account</h3>
            <p style="color: var(--color-muted); font-size: 0.88rem; margin-bottom: 24px;">Register once to coordinate all your consultations, lab reports, and pharmacy bills.</p>

            <form onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label style="font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; display: block;">Full Name</label>
                    <input type="text" id="regName" class="form-control" style="padding: 10px 14px; border-radius: 8px;" placeholder="e.g. Swaraj Chandurkar" required>
                </div>
                <div class="mb-3">
                    <label style="font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; display: block;">Username</label>
                    <input type="text" id="regUser" class="form-control" style="padding: 10px 14px; border-radius: 8px;" placeholder="e.g. swaraj@123" required>
                </div>
                <div class="mb-3">
                    <label style="font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; display: block;">Contact Number</label>
                    <input type="tel" id="regPhone" class="form-control" style="padding: 10px 14px; border-radius: 8px;" placeholder="e.g. 9876543210" required>
                </div>
                <div class="mb-4">
                    <label style="font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; display: block;">Password</label>
                    <input type="password" id="regPass" class="form-control" style="padding: 10px 14px; border-radius: 8px;" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-cb-primary">Complete Registration</button>
            </form>
        </div>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            alert("Account created successfully! Redirecting to Patient Portal...");
            window.location.href = "portal.html?role=patient";
        }
    </script>
</body>
</html>
